[project]
name = "vajra"
version = "0.1.0"
description = "Vector-Attention Justification for Robust Anomaly Detection"
requires-python = ">=3.10,<3.13"

dependencies = [
    "torch==2.7.1",
    "numpy==1.26.4",
    "adversarial-robustness-toolbox==1.20.1",
    "pandas==2.2.2",
    "scikit-learn==1.4.2",
    "pyarrow==16.0.0",
    "PyYAML==6.0.1",
    "typer==0.12.3",
    "mlflow==2.16.1",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "streamlit==1.35.0",
    "plotly==5.22.0",
    "requests==2.31.0",
    "joblib==1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100